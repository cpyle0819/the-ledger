<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Ledger — an archive of works</title>
  <link rel="icon" href="/seal.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Theme fonts: the built-in default's fonts, so first paint has them without
       waiting on the manifest. The theme controller swaps #theme-fonts on apply. -->
  <link id="theme-fonts" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <!-- Structure (theme-agnostic) then the theme's token+decoration layer. The
       controller swaps #theme-css to the resolved theme's stylesheet URL; this
       default keeps the page painted before the registry loads. Themes are
       packages like plugins — the server discovers installed theme packages and
       serves their assets under /theme/<id>/… (see src/server/theme-interface.ts
       and src/client/core/theme.ts). -->
  <link rel="stylesheet" href="/base.css" />
  <link id="theme-css" rel="stylesheet" href="/theme/the-ledger/theme.css" />
  <!-- Pre-paint theme replay. The theme controller caches the last-resolved
       theme's asset URLs in localStorage (`ledger:theme:applied`); this blocking
       inline script replays them onto #theme-css/#theme-fonts before first paint,
       so a reload paints in the active theme instead of flashing the-ledger
       default above while the module loads and the /api/source handshake resolves.
       No cache (first-ever visit) → the HTML defaults stand. initTheme still runs
       and is authoritative; this only skips the flash. -->
  <script>
    (function () {
      try {
        var applied = JSON.parse(localStorage.getItem('ledger:theme:applied') || 'null');
        if (!applied || !applied.stylesheet) return;
        document.documentElement.setAttribute('data-theme', applied.id);
        // Replay root-target modes (e.g. data-mode="light") so a reload paints in
        // the active mode, not the theme's CSS default — no flash of the wrong palette.
        if (applied.root) {
          for (var k in applied.root) {
            if (Object.prototype.hasOwnProperty.call(applied.root, k)) {
              document.documentElement.setAttribute(k, applied.root[k]);
            }
          }
        }
        var css = document.getElementById('theme-css');
        if (css) css.href = applied.stylesheet;
        if (applied.fonts) {
          var fonts = document.getElementById('theme-fonts');
          if (fonts) fonts.href = applied.fonts;
        }
      } catch (e) { /* malformed cache — the HTML defaults stand */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#stage">Skip to content</a>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Ambient drift layer — the active theme mounts its own effect component here
       (the-ledger's pipe smoke, another theme's starfield, or nothing). The theme
       controller (core/theme.applyAmbient) fills this from the manifest's
       `ambient` {tag, src, attrs}; it starts empty. -->
  <div id="ambient-layer" aria-hidden="true"></div>

  <!-- <ledger-board> is the app root: a light-DOM element that owns the model,
       filters, and lens rendering. Its children (masthead, controls, stage) keep
       their global styling; the element supplies behavior, not encapsulation. -->
  <ledger-board>
  <header class="masthead">
    <div class="mast-left">
      <div class="mark">
        <h1 class="ledger-title" aria-label="The Ledger"></h1>
      </div>
      <p class="mast-sub">an archive of <em>epics</em>, <em>stories</em> &amp; <em>tasks</em></p>
    </div>
    <div class="mast-right">
      <p class="ident" id="ident">
        <span class="ident-dot" aria-hidden="true"></span>
        <span class="sr-only">Signed in as</span>
        <span id="ident-name">…</span>
      </p>
      <!-- Theme switcher — populated from the manifest by the theme controller. -->
      <label class="sr-only" for="theme-select">Theme</label>
      <select class="theme-select" id="theme-select" title="Switch theme" aria-label="Switch theme"></select>
      <!-- Theme settings gear — shown only when the active theme declares tunable
           knobs (app.ts toggles [hidden] on theme change). Opens <ledger-settings>. -->
      <button class="ghost-btn icon-btn" id="settings-btn" title="Theme settings" aria-label="Theme settings" hidden>⚙</button>
      <button class="ghost-btn" id="refresh" aria-keyshortcuts="r" title="Refresh (r)">
        <span aria-hidden="true">↻ </span>refresh
      </button>
      <button class="ghost-btn icon-btn" id="about-btn" title="About" aria-label="About the Ledger">?</button>
    </div>
  </header>

  <nav class="controls" aria-label="Filters and view">
    <div class="ctl" role="group" aria-labelledby="assignee-label">
      <span class="ctl-label" id="assignee-label">assignee</span>
      <div class="seg" id="assignee-seg" role="group" aria-labelledby="assignee-label">
        <button type="button" data-assignee="" class="on" aria-pressed="true">me</button>
        <button type="button" data-assignee="anyone" aria-pressed="false">anyone</button>
        <input type="text" id="assignee-input" placeholder="a name…" spellcheck="false" aria-label="Filter by a specific assignee" />
      </div>
    </div>
    <!-- Shown only when the active source declares the `projects` capability;
         populated from /api/projects at startup. -->
    <div class="ctl" id="project-ctl" role="group" aria-labelledby="project-label" hidden>
      <span class="ctl-label" id="project-label">project</span>
      <select id="project-select" class="ctl-select" aria-labelledby="project-label">
        <option value="">all projects</option>
      </select>
    </div>
    <div class="ctl">
      <label class="switch" title="Closed items are hidden by default">
        <input type="checkbox" id="show-closed" />
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="switch-text">show closed items</span>
      </label>
    </div>
    <div class="ctl grow"></div>
    <div class="ctl" role="group" aria-labelledby="view-label">
      <span class="ctl-label" id="view-label">view</span>
      <div class="seg" id="lens-seg" role="group" aria-labelledby="view-label">
        <button type="button" data-lens="columns" class="on" aria-pressed="true" aria-keyshortcuts="1" title="Columns (1)"><span aria-hidden="true">▚ </span>columns</button>
        <button type="button" data-lens="outline" aria-pressed="false" aria-keyshortcuts="2" title="Outline (2)"><span aria-hidden="true">☰ </span>outline</button>
      </div>
    </div>
  </nav>

  <main id="stage" class="stage" data-lens="columns" tabindex="-1" aria-label="Epics, stories and tasks">
    <p class="loading" id="loading" role="status"><span class="spin" aria-hidden="true"></span> reading the archive…</p>
  </main>
  </ledger-board>

  <!-- Reading drawer — the manuscript page. The <ledger-drawer> element renders
       the whole overlay (fields, description editor, contains list, comment
       thread, focus trap) in its own shadow DOM; app.js injects the api/fetch
       services and listens for item-changed to patch the board. -->
  <ledger-drawer id="drawer"></ledger-drawer>

  <!-- Compose sheet — the "new entry" leaf. Shown only when the active source
       advertises `create`. Renders the fields the source declares it accepts,
       posts to the create route, and emits item-created for the board to place
       the new item in the tree without a reload. -->
  <ledger-compose id="compose"></ledger-compose>

  <!-- About modal — a short explainer of the Ledger's opinions (three tiers,
       measured velocity). Fixed prose, no injected services; opened from the
       masthead "?" button. -->
  <ledger-about id="about"></ledger-about>

  <!-- Theme settings modal — renders the active theme's tunable knobs (ambient
       effects, etc.) from its manifest; opened from the masthead gear. -->
  <ledger-settings id="settings"></ledger-settings>

  <div class="toast" id="toast" role="status" aria-live="assertive"></div>

  <script type="module" src="/build/client/app.js"></script>
</body>
</html>
