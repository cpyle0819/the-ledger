<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Ledger">
  <title>The Ledger</title>
  <!-- The standalone mark: a square tooled-leather cartouche carrying a
       gold-tooled "TL" monogram. Shares its look with the masthead logo
       (@cpyle0819/ledger-theme-the-ledger mark.js) — keep the two in sync. A
       plate of oxblood leather with an engraved gold double-keyline border and
       the monogram stamped in gold leaf, read by both value contrast (~7-10:1)
       and edge relief. -->
  <defs>
    <!-- Tooled-leather face: warm oxblood-brown, lit upper-left. -->
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a3419"/>
      <stop offset="0.5" stop-color="#33230f"/>
      <stop offset="1" stop-color="#241708"/>
    </linearGradient>
    <!-- Gold-leaf tooling: lit crown to shadowed foot. -->
    <linearGradient id="tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4c584"/>
      <stop offset="0.5" stop-color="#b08d4f"/>
      <stop offset="1" stop-color="#7a5f30"/>
    </linearGradient>
  </defs>

  <!-- Cast shadow lifting the plate off the surface below. -->
  <rect x="6.5" y="8.5" width="52" height="52" rx="9" fill="#000" opacity="0.34"/>

  <!-- The leather plate. -->
  <rect x="5" y="6" width="52" height="52" rx="9" fill="url(#leather)"
        stroke="#5c421f" stroke-opacity="0.6" stroke-width="1"/>

  <!-- Engraved double keyline: a blind (dark) impression with gold leaf laid in,
       then a fainter innermost gold rule. -->
  <rect x="9" y="10" width="44" height="44" rx="6" fill="none"
        stroke="#1a1206" stroke-opacity="0.55" stroke-width="2.4"/>
  <rect x="9" y="10" width="44" height="44" rx="6" fill="none"
        stroke="url(#tool)" stroke-width="1.1"/>
  <rect x="12.5" y="13.5" width="37" height="37" rx="4" fill="none"
        stroke="url(#tool)" stroke-opacity="0.5" stroke-width="0.7"/>

  <!-- Gold-tooled "TL": stamped in gold leaf over a dark drop, so it reads by
       both value contrast and tooled-into-leather relief. -->
  <g font-family="'Libre Caslon Display', 'IM Fell English', Georgia, serif"
     font-size="26" text-anchor="middle" dominant-baseline="alphabetic">
    <text x="31.6" y="41.8" fill="#120b03" fill-opacity="0.55">TL</text>
    <text x="31" y="41" fill="url(#tool)" stroke="#6e5320" stroke-width="0.4" stroke-opacity="0.5">TL</text>
  </g>
</svg>
