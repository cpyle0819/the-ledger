<svg xmlns="http://www.w3.org/2000/svg" width="360" height="260">
  <!-- Soft, low-frequency fractal noise tinted a faint yellow-brown, so it reads
       as drifting parchment stains/foxing rather than fine grain. Alpha is
       driven by the noise and pulled down hard, then blurred, so only gentle
       cloud-like blotches survive. Used as a tiled card background; the tile is
       large and each card crops a different region, so repetition isn't obvious. -->
  <filter id="clouds" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.017" numOctaves="4" seed="7" stitchTiles="stitch" result="n"/>
    <!-- Tint the noise a yellow-brown and let its own luminance drive alpha, so
         darker noise = denser stain. Gentle gamma keeps mid-blotches present. -->
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.42
              0 0 0 0 0.29
              0 0 0 0 0.13
              0.6 0.6 0.6 0 -0.60"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.5" intercept="0"/>
    </feComponentTransfer>
    <feGaussianBlur stdDeviation="0.8"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#clouds)"/>
</svg>
